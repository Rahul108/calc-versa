name: CI

on:
  push:
    branches: [main, master, "feature/*", develop]
  pull_request:
    branches: [main, master, "feature/*", develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-engine:
    name: Go compute engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/compute-service-golang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/compute-service-golang/go.mod
          cache-dependency-path: backend/compute-service-golang/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "Run gofmt" && exit 1)
      - run: go test -race -cover ./...

  api-gateway:
    name: API Gateway (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/api-gateway-nodejs/package-lock.json
            libs/db/package-lock.json
      - name: Install shared db library
        run: npm ci
        working-directory: libs/db
      - name: Install gateway
        run: npm ci --legacy-peer-deps
        working-directory: backend/api-gateway-nodejs
      - run: npm run typecheck
        working-directory: backend/api-gateway-nodejs
      - run: npm test
        working-directory: backend/api-gateway-nodejs
      - run: npm run build
        working-directory: backend/api-gateway-nodejs

  ai-assistant:
    name: AI Assistant (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai-assistant-service-nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/ai-assistant-service-nodejs/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test # includes libs/observability specs
      - run: npm run build

  analysis-service:
    name: Python analysis service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/analysis-service-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/analysis-service-python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit -p frontend/tsconfig.app.json
      - run: npx tsc --noEmit -p frontend/tsconfig.spec.json
      - run: npx eslint frontend/src
      - run: npx jest -c frontend/jest.config.js
      - run: npx vite build --config frontend/vite.config.ts
