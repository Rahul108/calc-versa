services:
  # ---------------------------------------------------------------------------
  # Database Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: calcversa-postgres
    restart: always
    environment:
      POSTGRES_USER: calcversa_user
      POSTGRES_PASSWORD: calcversa_pass
      POSTGRES_DB: calcversa
    ports:
      - '5435:5432' # Host port 5435 avoids conflict with local PostgreSQL 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcversa_user -d calcversa"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Message Broker Infrastructure
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: calcversa-rabbitmq
    restart: always
    ports:
      - '5675:5672'   # AMQP protocol
      - '15675:15672' # Management Dashboard (http://localhost:15675)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # ---------------------------------------------------------------------------
  # Primary API Gateway Microservice (Ready & Active)
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/api-gateway-nodejs.Dockerfile
    container_name: calcversa-api-gateway
    restart: always
    ports:
      - '3005:3000' # Swagger UI served at http://localhost:3005/api/docs
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: calcversa_user
      DB_PASSWORD: calcversa_pass
      DB_NAME: calcversa
      JWT_SECRET: calcversa_secret_jwt_key_2026
      COMPUTE_SERVICE_URL: http://compute-service:8080
    volumes:
      # Bind mounts for host live hot-reloading
      - ../../backend/api-gateway-nodejs:/app/backend/api-gateway-nodejs
      - ../../libs/db:/app/libs/db
      # Bind mount for host log file visibility (logs/app-<date>.log and logs/error-<date>.log)
      - ../../backend/api-gateway-nodejs/logs:/app/backend/api-gateway-nodejs/logs
      # Anonymous volumes preserving container node_modules & dist from root permission locks
      - /app/backend/api-gateway-nodejs/node_modules
      - /app/backend/api-gateway-nodejs/dist
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Go Compute Engine Microservice (Active)
  # ---------------------------------------------------------------------------
  compute-service:
    build:
      context: ../..
      dockerfile: infra/docker/compute-service-golang.Dockerfile
    container_name: calcversa-compute-service
    restart: always
    ports:
      - '8085:8080' # Host port 8085 serves Go Compute Engine (http://localhost:8085/health)
    environment:
      PORT: 8080
    volumes:
      - ../../backend/compute-service-golang:/app
      - ../../backend/compute-service-golang/logs:/app/logs

  # ---------------------------------------------------------------------------
  # AI Assistant Microservice (Active)
  # ---------------------------------------------------------------------------
  ai-assistant-service:
    build:
      context: ../..
      dockerfile: infra/docker/ai-assistant-service-nodejs.Dockerfile
    container_name: calcversa-ai-assistant
    restart: always
    ports:
      - '3006:3001' # Host port 3006 serves AI Assistant API
    environment:
      NODE_ENV: development
      PORT: 3001
      API_GATEWAY_URL: http://api-gateway:3000
    env_file:
      - ../../backend/ai-assistant-service-nodejs/.env
    volumes:
      - ../../backend/ai-assistant-service-nodejs:/app/backend/ai-assistant-service-nodejs
      - ../../backend/ai-assistant-service-nodejs/logs:/app/backend/ai-assistant-service-nodejs/logs
      - /app/backend/ai-assistant-service-nodejs/node_modules
      - /app/backend/ai-assistant-service-nodejs/dist

  # ---------------------------------------------------------------------------
  # React SPA Frontend Application (Active in Docker)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/calc-versa-react.Dockerfile
    container_name: calcversa-frontend
    restart: always
    ports:
      - '4200:80' # Host port 4200 serves React Frontend via Nginx
    depends_on:
      - api-gateway
      - ai-assistant-service

  # ---------------------------------------------------------------------------
  # Additional Polyglot Microservices (Uncomment when ready to run)
  # ---------------------------------------------------------------------------

  # analysis-service:
  #   build:
  #     context: ../..
  #     dockerfile: infra/docker/analysis-service-python.Dockerfile
  #   container_name: calcversa-analysis-service
  #   restart: always
  #   ports:
  #     - '8005:8000'
  #   volumes:
  #     - ../../backend/analysis-service-python:/app
  #     - ../../backend/analysis-service-python/logs:/app/logs

volumes:
  postgres_data:
