version: "3.9"
services:
  db:
    image: postgres:15
    container_name: calcversa-db
    restart: always
    environment:
      POSTGRES_DB: calcversa
      POSTGRES_USER: calcversa_user
      POSTGRES_PASSWORD: calcversa_pass
    ports:
      - "5432:5432"
    networks:
      - calcversa-net
    volumes:
      - pgdata:/var/lib/postgresql/data

  ai-assistant-service:
    build:
      context: ../..
      dockerfile: infra/docker/ai-assistant-service-nodejs.Dockerfile
    container_name: calcversa-ai-assistant
    restart: always
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key_here}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    networks:
      - calcversa-net

volumes:
  pgdata:

networks:
  calcversa-net:
    driver: bridge
